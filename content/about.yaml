heading: About

paragraphs:
  - >-
   Electrical & Electronic Engineering — Final Year | CUET, interested in power systems, power electronics, renewable energy, and solar cell technology. I enjoy working on practical engineering problems through simulation, design, and hands-on projects.
  - >-
    I’ve worked with MATLAB, Simulink, ADS, AutoCAD Electrical, Proteus and ESP32-based embedded and IoT systems. Alongside my academic projects, I’m developing my interest in photovoltaic technology and engineering research, with a focus on learning, experimenting and building practical solutions.
  
