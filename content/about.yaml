heading: About

paragraphs:
  - >-
    I am an Electrical and Electronic Engineering student at Chittagong University of Engineering & Technology (CUET),
    with an interest in power systems, electronics, renewable energy, and emerging engineering technologies.

  - >-
    Through academic projects and laboratory work, I have worked with tools such as MATLAB, Simulink, AutoCAD Electrical,
    ADS, Proteus, and ESP32-based systems, developing practical experience in simulation, circuit design, and embedded systems.

  - >-
    I enjoy learning through hands-on projects and exploring engineering problems that connect theoretical concepts with
    practical applications. I am particularly interested in power engineering, renewable energy, electronics, and research.

focusAreas:
  - Power systems and electrical engineering.
  - Renewable energy and advanced solar cell technologies.
  - Circuit design, simulation, and electronics.
  - MATLAB and Simulink based engineering analysis.
  - Embedded systems, ESP32, and IoT applications.
  - Engineering research and practical project development.